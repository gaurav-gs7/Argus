name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.32.3
      - name: Check Go formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./demo/services)"
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests with race detector
        run: go test -race ./...
      - name: Enforce Go coverage floors
        run: make test
      - name: Evaluate deterministic RCA contract
        run: make rca-eval
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Install Python AI service dependencies
        run: python -m pip install -r ai-service/requirements.txt
      - name: Compile Python AI service
        run: PYTHONPYCACHEPREFIX=/tmp/argus-pycache python -m compileall -q ai-service/app ai-service/tests
      - name: Run AI governance and prompt-injection tests
        run: PYTHONPATH=ai-service python -m unittest discover -s ai-service/tests -v
      - name: Validate Docker Compose configs
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.full.yml config >/dev/null
      - name: Validate Kubernetes packaging
        run: make k8s-check
      - name: Validate shell and JSON artifacts
        run: |
          bash -n scripts/*.sh
          python -m json.tool configs/verdikt/policies.yaml >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              *Path("configs/grafana/dashboards").glob("*.json"),
              *Path("configs/keycloak").glob("*.json"),
              *Path("demo/alerts").glob("*.json"),
              *Path("docs/demo-evidence").glob("*.json"),
          ]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"validated {len(paths)} JSON artifacts")
          PY
      - name: Validate Prometheus and Alertmanager configs
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/configs/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/configs/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm \
            -v "$PWD/configs/opa:/policies:ro" \
            openpolicyagent/opa:1.4.2 check /policies/remediation.rego
      - name: Build production images
        run: |
          docker build -f Dockerfile.api -t argus-api:ci .
          docker build -f Dockerfile.worker -t argus-worker:ci .
          docker build -t argus-ai:ci ai-service
      - name: Check docs are portable
        run: python scripts/check-portable-docs.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - name: Test PostgreSQL and JetStream boundaries
        run: make integration-test

  approval-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - name: Test durable approval transaction
        env:
          ARGUS_INTEGRATION_POSTGRES_DSN: postgres://argus:argus@localhost:5432/argus?sslmode=disable
        run: go test -race ./tests/integration -v

  oidc-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start isolated OIDC and Argus API stack
        run: docker compose up -d --build argus-api
      - name: Test JWT claims, signature verification, and RBAC
        run: ./scripts/test-oidc-e2e.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=200 keycloak argus-api
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v --remove-orphans

  helios-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HELIOS_REF: 8bb44ca9bb20d0714f1ff0dbeb9dec7fdb5a350f
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: gaurav-gs7/Helios
          ref: ${{ env.HELIOS_REF }}
          path: helios-src
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: |
            go.sum
            helios-src/go.sum
      - name: Start NATS JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js
      - name: Start Helios control plane and worker
        working-directory: helios-src
        env:
          HELIOS_DATABASE_URL: postgres://argus:argus@localhost:5432/helios?sslmode=disable
          HELIOS_NATS_URL: nats://localhost:4222
          HELIOS_ADMIN_TOKEN: ci-helios-admin
          HELIOS_WORKER_BOOTSTRAP_TOKEN: ci-helios-worker
          HELIOS_HTTP_ADDR: ":18080"
          HELIOS_GRPC_ADDR: ":18081"
          HELIOS_CONTROL_PLANE_URL: http://localhost:18080
          HELIOS_CONTROL_PLANE_GRPC_ADDR: localhost:18081
        run: |
          PGPASSWORD=argus psql -h localhost -U argus -d argus -c 'CREATE DATABASE helios'
          go build -o "$RUNNER_TEMP/helios-control-plane" ./cmd/control-plane
          go build -o "$RUNNER_TEMP/helios-worker" ./cmd/worker
          nohup "$RUNNER_TEMP/helios-control-plane" > "$RUNNER_TEMP/helios-control-plane.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:18080/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:18080/healthz
          nohup "$RUNNER_TEMP/helios-worker" > "$RUNNER_TEMP/helios-worker.log" 2>&1 &
          sleep 5
      - name: Test Argus delegation and reconciliation against Helios
        env:
          ARGUS_TEST_POSTGRES_DSN: postgres://argus:argus@localhost:5432/argus?sslmode=disable
          ARGUS_TEST_HELIOS_URL: http://localhost:18080
          ARGUS_TEST_HELIOS_TOKEN: ci-helios-admin
        run: go test -race -count=1 -run TestHeliosLive -v ./internal/remediation
      - name: Show Helios logs on failure
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/helios-control-plane.log" "$RUNNER_TEMP/helios-worker.log"
