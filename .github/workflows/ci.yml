name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Go formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./demo/services)"
      - name: Run Go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...
      - name: Compile Python AI service
        run: PYTHONPYCACHEPREFIX=/tmp/argus-pycache python -m compileall -q ai-service/app
      - name: Validate Docker Compose configs
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.full.yml config >/dev/null
      - name: Check docs are portable
        run: python scripts/check-portable-docs.py
