global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: argus-api
    static_configs:
      - targets: ["argus-api:8080"]

  - job_name: argus-ai
    static_configs:
      - targets: ["argus-ai:8090"]

  - job_name: payments-api
    static_configs:
      - targets: ["payments-api:9001"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
