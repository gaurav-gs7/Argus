groups:
  - name: payments-api
    rules:
      - alert: PaymentsAPIHighErrorRate
        expr: rate(http_requests_total{service="payments-api",status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: sev2
          service: payments-api
          environment: local
        annotations:
          summary: "High 5xx rate on payments-api"
          runbook: "postgres-connection-exhaustion"

      - alert: PaymentsAPIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="payments-api"}[5m])) > 0.8
        for: 3m
        labels:
          severity: sev3
          service: payments-api
          environment: local
        annotations:
          summary: "High p95 latency on payments-api"

      - alert: PaymentsAPIPostgresPoolSaturation
        expr: db_connection_pool_in_use / db_connection_pool_max > 0.9
        for: 1m
        labels:
          severity: sev2
          service: payments-api
          environment: local
        annotations:
          summary: "payments-api postgres pool saturation"

  - name: argus-control-plane
    rules:
      - alert: ArgusPolicyDenialsHigh
        expr: increase(argus_policy_denials_total[10m]) > 3
        for: 2m
        labels:
          severity: sev3
          service: argus
          environment: local
        annotations:
          summary: "Argus policy denials are increasing"
          runbook: "remediation-safety"

      - alert: ArgusRemediationFailures
        expr: increase(argus_remediation_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: sev2
          service: argus
          environment: local
        annotations:
          summary: "Argus remediation worker reported failures"
          runbook: "remediation-safety"

      - alert: ArgusRCAJobsFailing
        expr: increase(argus_rca_jobs_total{result="failed"}[10m]) > 0
        for: 1m
        labels:
          severity: sev3
          service: argus
          environment: local
        annotations:
          summary: "Argus RCA generation is failing"
          runbook: "incident-lifecycle"

      - alert: ArgusAIAdvisoryLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(argus_ai_advisory_latency_seconds_bucket[10m]))) > 10
        for: 5m
        labels:
          severity: sev3
          service: argus-ai
          environment: local
        annotations:
          summary: "Argus AI advisory p95 latency exceeds 10 seconds"
          runbook: "llm-design"

      - alert: ArgusAIGovernanceUnavailable
        expr: increase(argus_ai_governance_decisions_total{decision="unavailable"}[10m]) > 0
        for: 1m
        labels:
          severity: sev2
          service: argus-ai
          environment: local
        annotations:
          summary: "Verdikt governance is unavailable; AI proposals are failing closed"
          runbook: "remediation-safety"

      - alert: ArgusPromptInjectionDetected
        expr: increase(argus_ai_prompt_injection_blocks_total[10m]) > 0
        for: 1m
        labels:
          severity: sev3
          service: argus-ai
          environment: local
        annotations:
          summary: "Argus blocked prompt-injection content in incident evidence"
          runbook: "llm-design"

      - alert: ArgusApprovalPendingTooLong
        expr: argus_approvals_pending > 0
        for: 10m
        labels:
          severity: sev3
          service: argus
          environment: local
        annotations:
          summary: "Argus has remediation approvals waiting longer than the response SLO"
          runbook: "remediation-safety"

      - alert: ArgusApprovalNotificationFailing
        expr: increase(argus_approval_notification_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: sev2
          service: argus
          environment: local
        annotations:
          summary: "Argus cannot deliver approval notifications"
          runbook: "remediation-safety"

      - alert: ArgusApprovalExpired
        expr: increase(argus_approval_requests_total{status="expired"}[15m]) > 0
        for: 1m
        labels:
          severity: sev2
          service: argus
          environment: local
        annotations:
          summary: "A remediation timed out without a human approval decision"
          runbook: "remediation-safety"

      - alert: ArgusAuthenticationFailuresHigh
        expr: sum(increase(argus_authentication_failures_total[5m])) > 10
        for: 2m
        labels:
          severity: sev2
          service: argus
          environment: local
        annotations:
          summary: "Argus is rejecting an unusual number of OIDC tokens"
          runbook: "oidc-authentication"

      - alert: ArgusAuthorizationDenialsHigh
        expr: sum(increase(argus_authorization_denials_total[5m])) > 5
        for: 2m
        labels:
          severity: sev3
          service: argus
          environment: local
        annotations:
          summary: "Argus RBAC denials are increasing"
          runbook: "oidc-authentication"

      - alert: ArgusOIDCProviderUnavailable
        expr: up{job="keycloak"} == 0
        for: 2m
        labels:
          severity: sev2
          service: argus
          environment: local
        annotations:
          summary: "Argus local OIDC provider is unavailable"
          runbook: "oidc-authentication"

      - alert: ArgusAuditChainIntegrityViolation
        expr: argus_audit_chain_integrity == 0
        for: 1m
        labels:
          severity: sev1
          service: argus
          environment: local
        annotations:
          summary: "Argus detected a tamper-evident audit chain integrity violation"
          runbook: "audit-integrity"
