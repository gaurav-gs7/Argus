services:
  postgres:
    image: postgres:16
    mem_limit: 384m
    cpus: 0.50
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    mem_limit: 128m
    cpus: 0.25
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  argus-api:
    mem_limit: 256m
    cpus: 0.50
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ARGUS_HTTP_ADDR: :8080
      ARGUS_POSTGRES_DSN: postgres://argus:argus@postgres:5432/argus?sslmode=disable
      ARGUS_REDIS_ADDR: redis:6379
      ARGUS_NATS_URL: nats://nats:4222
      ARGUS_LLM_BACKEND: mock
      ARGUS_AI_SERVICE_URL: http://argus-ai:8090
      ARGUS_AI_SERVICE_TOKEN: ${ARGUS_AI_SERVICE_TOKEN:-argus-ai-local}
      ARGUS_AUTH_TOKENS: ${ARGUS_AUTH_TOKENS:-local-admin-token:admin:admin@local,local-operator-token:operator:operator@local,local-viewer-token:viewer:viewer@local}
      ARGUS_LOG_LEVEL: INFO
      ARGUS_REMEDIATION_EXECUTOR: ${ARGUS_REMEDIATION_EXECUTOR:-local}
      ARGUS_HELIOS_BASE_URL: ${ARGUS_HELIOS_BASE_URL:-}
      ARGUS_HELIOS_ADMIN_TOKEN: ${ARGUS_HELIOS_ADMIN_TOKEN:-}
      ARGUS_HELIOS_POLL_TIMEOUT: ${ARGUS_HELIOS_POLL_TIMEOUT:-8s}
      ARGUS_APPROVAL_WEBHOOK_URL: ${ARGUS_APPROVAL_WEBHOOK_URL:-}
      ARGUS_APPROVAL_WEBHOOK_MODE: ${ARGUS_APPROVAL_WEBHOOK_MODE:-generic}
      ARGUS_APPROVAL_WEBHOOK_SECRET: ${ARGUS_APPROVAL_WEBHOOK_SECRET:-}
      ARGUS_APPROVAL_CALLBACK_BASE_URL: ${ARGUS_APPROVAL_CALLBACK_BASE_URL:-http://localhost:8080}
      ARGUS_APPROVAL_TIMEOUT: ${ARGUS_APPROVAL_TIMEOUT:-15m}
      ARGUS_APPROVAL_ESCALATE_AFTER: ${ARGUS_APPROVAL_ESCALATE_AFTER:-5m}
      ARGUS_APPROVAL_SWEEP_INTERVAL: ${ARGUS_APPROVAL_SWEEP_INTERVAL:-15s}
      ARGUS_APPROVAL_NOTIFY_TIMEOUT: ${ARGUS_APPROVAL_NOTIFY_TIMEOUT:-3s}
      ARGUS_APPROVAL_ALLOW_SELF_APPROVAL: ${ARGUS_APPROVAL_ALLOW_SELF_APPROVAL:-false}
      ARGUS_SLACK_SIGNING_SECRET: ${ARGUS_SLACK_SIGNING_SECRET:-}
      ARGUS_SLACK_BOT_TOKEN: ${ARGUS_SLACK_BOT_TOKEN:-}
      ARGUS_SLACK_APPROVERS: ${ARGUS_SLACK_APPROVERS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started

  argus-worker:
    mem_limit: 192m
    cpus: 0.35
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      ARGUS_POSTGRES_DSN: postgres://argus:argus@postgres:5432/argus?sslmode=disable
      ARGUS_REDIS_ADDR: redis:6379
      ARGUS_NATS_URL: nats://nats:4222
      ARGUS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started

  verdikt:
    mem_limit: 192m
    cpus: 0.35
    build:
      context: ${VERDIKT_BUILD_CONTEXT:-../Verdikt}
      dockerfile: Dockerfile.argus
    environment:
      VERDIKT_API_TOKEN: ${ARGUS_VERDIKT_API_TOKEN:-argus-verdikt-local}
      VERDIKT_TELEMETRY: disabled
    volumes:
      - verdikt-data:/app/data
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  argus-ai:
    mem_limit: 256m
    cpus: 0.50
    build:
      context: ./ai-service
    environment:
      ARGUS_AI_ADDR: :8090
      ARGUS_LLM_BACKEND: mock
      ARGUS_AI_SERVICE_TOKEN: ${ARGUS_AI_SERVICE_TOKEN:-argus-ai-local}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      ARGUS_RUNBOOK_PATH: /data/runbooks
      ARGUS_PAST_INCIDENTS_PATH: /data/incidents/sample-past-incidents.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-lite}
      ARGUS_VERDIKT_URL: http://verdikt:8080
      ARGUS_VERDIKT_API_TOKEN: ${ARGUS_VERDIKT_API_TOKEN:-argus-verdikt-local}
      ARGUS_VERDIKT_TIMEOUT_SECONDS: ${ARGUS_VERDIKT_TIMEOUT_SECONDS:-3}
      ARGUS_LLM_INPUT_COST_PER_MILLION_USD: ${ARGUS_LLM_INPUT_COST_PER_MILLION_USD:-0}
      ARGUS_LLM_OUTPUT_COST_PER_MILLION_USD: ${ARGUS_LLM_OUTPUT_COST_PER_MILLION_USD:-0}
    volumes:
      - ./demo/runbooks:/data/runbooks:ro
      - ./demo/incidents:/data/incidents:ro
    ports:
      - "8090:8090"
    depends_on:
      verdikt:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    mem_limit: 384m
    cpus: 0.50
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./configs/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    mem_limit: 384m
    cpus: 0.50
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.0.0
    mem_limit: 256m
    cpus: 0.35
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml
    ports:
      - "3100:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    mem_limit: 192m
    cpus: 0.35
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/otel/otel-collector.yml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  payments-api:
    mem_limit: 128m
    cpus: 0.25
    build:
      context: ./demo/services/payments-api
    environment:
      PAYMENTS_API_ADDR: :9001
      SERVICE_NAME: payments-api
    ports:
      - "9001:9001"

volumes:
  verdikt-data:

networks:
  default:
    name: argus
