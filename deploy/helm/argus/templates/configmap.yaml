apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.fullname" . }}-control-plane
  labels:
    {{- include "argus.labels" . | nindent 4 }}
data:
  ARGUS_ENV: {{ .Values.global.environment | quote }}
  ARGUS_LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  ARGUS_HTTP_ADDR: ":8080"
  ARGUS_OIDC_ISSUER_URL: {{ required "controlPlane.oidc.issuerURL is required" .Values.controlPlane.oidc.issuerURL | quote }}
  ARGUS_OIDC_AUDIENCE: {{ required "controlPlane.oidc.audience is required" .Values.controlPlane.oidc.audience | quote }}
  ARGUS_OIDC_ROLE_CLAIM: {{ .Values.controlPlane.oidc.roleClaim | quote }}
  ARGUS_OIDC_ROLE_MAPPINGS: {{ .Values.controlPlane.oidc.roleMappings | quote }}
  ARGUS_REMEDIATION_EXECUTOR: {{ .Values.controlPlane.remediationExecutor | quote }}
  ARGUS_HELIOS_BASE_URL: {{ .Values.controlPlane.heliosBaseURL | quote }}
  ARGUS_APPROVAL_CALLBACK_BASE_URL: {{ .Values.controlPlane.approvalCallbackBaseURL | quote }}
  ARGUS_APPROVAL_TIMEOUT: {{ .Values.controlPlane.approvalTimeout | quote }}
  ARGUS_APPROVAL_ESCALATE_AFTER: {{ .Values.controlPlane.approvalEscalateAfter | quote }}
  ARGUS_AI_SERVICE_URL: {{ default (printf "http://%s-ai:%v" (include "argus.fullname" .) .Values.ai.service.port) .Values.controlPlane.aiServiceURL | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.fullname" . }}-ai
  labels:
    {{- include "argus.labels" . | nindent 4 }}
data:
  ARGUS_AI_ADDR: "0.0.0.0:8090"
  ARGUS_LLM_BACKEND: {{ .Values.ai.backend | quote }}
  OLLAMA_BASE_URL: {{ .Values.ai.ollamaBaseURL | quote }}
  OLLAMA_MODEL: {{ .Values.ai.ollamaModel | quote }}
  GEMINI_MODEL: {{ .Values.ai.geminiModel | quote }}
  ARGUS_VERDIKT_URL: {{ .Values.ai.verdiktURL | quote }}
  ARGUS_RUNBOOK_PATH: {{ .Values.ai.runbookPath | quote }}
  ARGUS_PAST_INCIDENTS_PATH: {{ .Values.ai.pastIncidentsPath | quote }}
