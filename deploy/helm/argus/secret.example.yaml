apiVersion: v1
kind: Secret
metadata:
  name: argus-runtime
type: Opaque
stringData:
  ARGUS_POSTGRES_DSN: postgres://argus:REPLACE_ME@postgres.example:5432/argus?sslmode=require
  # Optional: a role with DDL privileges used only by `argus-api migrate`.
  # When unset, migrations use ARGUS_POSTGRES_DSN.
  ARGUS_MIGRATION_POSTGRES_DSN: ""
  ARGUS_REDIS_ADDR: redis.example:6379
  ARGUS_NATS_URL: nats://nats.example:4222
  ARGUS_AI_SERVICE_TOKEN: REPLACE_ME
  ARGUS_VERDIKT_API_TOKEN: REPLACE_ME
  ARGUS_PROMETHEUS_BEARER_TOKEN: ""
  ARGUS_LOKI_BEARER_TOKEN: ""
  GEMINI_API_KEY: REPLACE_ME
