apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-control-plane
data:
  ARGUS_ENV: production
  ARGUS_LOG_LEVEL: INFO
  ARGUS_HTTP_ADDR: ":8080"
  ARGUS_AI_SERVICE_URL: http://argus-ai:8090
  ARGUS_OIDC_ISSUER_URL: https://identity.example.com/realms/argus
  ARGUS_OIDC_AUDIENCE: argus-api
  ARGUS_OIDC_ROLE_CLAIM: realm_access.roles
  ARGUS_OIDC_ROLE_MAPPINGS: argus-admin=admin,argus-operator=operator,argus-viewer=viewer
  ARGUS_REMEDIATION_EXECUTOR: local
  ARGUS_APPROVAL_CALLBACK_BASE_URL: https://argus.example.com
  ARGUS_APPROVAL_TIMEOUT: 15m
  ARGUS_APPROVAL_ESCALATE_AFTER: 10m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-ai
data:
  ARGUS_AI_ADDR: ":8090"
  ARGUS_LLM_BACKEND: mock
  OLLAMA_BASE_URL: http://ollama.ai.svc.cluster.local:11434
  OLLAMA_MODEL: qwen2.5:1.5b
  GEMINI_MODEL: gemini-2.0-flash-lite
  ARGUS_VERDIKT_URL: http://verdikt.verdikt.svc.cluster.local:8080
  ARGUS_RUNBOOK_PATH: /data/runbooks
  ARGUS_PAST_INCIDENTS_PATH: /data/incidents/sample-past-incidents.json
