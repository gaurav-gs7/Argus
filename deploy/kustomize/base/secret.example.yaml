apiVersion: v1
kind: Secret
metadata:
  name: argus-runtime
type: Opaque
stringData:
  ARGUS_POSTGRES_DSN: postgres://argus:REPLACE_ME@postgres.example:5432/argus?sslmode=require
  ARGUS_REDIS_ADDR: redis.example:6379
  ARGUS_NATS_URL: nats://nats.example:4222
  ARGUS_AI_SERVICE_TOKEN: REPLACE_ME
  ARGUS_VERDIKT_API_TOKEN: REPLACE_ME
  GEMINI_API_KEY: REPLACE_ME

