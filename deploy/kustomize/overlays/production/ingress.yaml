apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argus.example.com
      secretName: argus-tls
  rules:
    - host: argus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argus-api
                port:
                  number: 8080

